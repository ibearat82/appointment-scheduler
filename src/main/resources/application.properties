# ---------------------------------------------------------------
# Appointment Scheduler - application settings
# Values in ${NAME:default} form can be overridden with environment
# variables (used for Azure App Service in Milestone 3), so no real
# passwords need to be committed to Git.
# ---------------------------------------------------------------
spring.application.name=appointment-scheduler
server.port=${PORT:8080}

# --- Database (MySQL 8) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appointment_scheduler?serverTimezone=America/Phoenix}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is created by database/appointment_scheduler.sql.
# Hibernate does not create or change tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Phoenix

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Default office-staff account (created at startup if no admin exists) ---
app.admin.email=${ADMIN_EMAIL:admin@clinic.test}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# --- Logging (SLF4J + Logback) ---
logging.level.root=INFO
logging.level.com.gcu.scheduler=INFO
logging.level.org.hibernate.SQL=WARN
