<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-4">
                <h1 class="h4 mb-3">Create a patient account</h1>
                <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</p>
                    </div>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input id="firstName" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input id="lastName" th:field="*{lastName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input id="phone" type="tel" th:field="*{phone}" class="form-control" th:errorclass="is-invalid" placeholder="602-555-0123">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="dateOfBirth" class="form-label">Date of birth</label>
                            <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                            <div class="form-text">8 to 64 characters.</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="confirmPassword" class="form-label">Confirm password</label>
                            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{passwordConfirmed}"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">Create account</button>
                </form>
                <p class="mt-3 mb-0 small text-center">Already registered? <a th:href="@{/login}">Log in</a></p>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
