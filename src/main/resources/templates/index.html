<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="hero p-4 p-md-5 mb-4">
        <h1 class="display-6 fw-semibold">Book your visit online</h1>
        <p class="lead mb-4">See open times, book in a few clicks, and reschedule or cancel any time.</p>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/register}" class="btn btn-light btn-lg me-2">Create an account</a>
            <a th:href="@{/login}" class="btn btn-outline-light btn-lg">Log in</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/dashboard}" class="btn btn-light btn-lg">Go to my dashboard</a>
        </div>
    </div>

    <h2 class="h4 mb-3">Visit types we offer</h2>
    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="vt : ${visitTypes}">
            <div class="card h-100">
                <div class="card-body">
                    <h3 class="h5 card-title" th:text="${vt.name}">Annual Checkup</h3>
                    <p class="card-text text-muted" th:text="${vt.description}">Description</p>
                    <span class="badge text-bg-light"><i class="bi bi-clock"></i>
                        <span th:text="${vt.durationMinutes} + ' min'">30 min</span></span>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(visitTypes)}" class="text-muted">No visit types are available yet.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
