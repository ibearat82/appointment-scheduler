<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">All appointments</h1>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form th:action="@{/admin/appointments}" method="get" class="row g-2 mb-3">
        <div class="col-auto"><input type="date" name="date" th:value="${date}" class="form-control"></div>
        <div class="col-auto"><button class="btn btn-outline-primary">Filter by day</button></div>
        <div class="col-auto" th:if="${date}"><a th:href="@{/admin/appointments}" class="btn btn-link">Show all</a></div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Date</th><th>Time</th><th>Patient</th><th>Contact</th><th>Visit type</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${#temporals.format(a.timeSlot.slotDate, 'MMM d, yyyy')}">date</td>
                    <td th:text="${#temporals.format(a.timeSlot.startTime, 'h:mm a')}">time</td>
                    <td th:text="${a.patient.fullName}">name</td>
                    <td><div th:text="${a.patient.email}">email</div><div class="small text-muted" th:text="${a.patient.phone}">phone</div></td>
                    <td th:text="${a.visitType.name}">type</td>
                    <td><span class="badge" th:classappend="${a.status.name() == 'BOOKED'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${a.status}">BOOKED</span></td>
                    <td class="text-end text-nowrap">
                        <th:block th:if="${a.status.name() == 'BOOKED'}">
                            <form th:action="@{/admin/appointments/{id}/complete(id=${a.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary">Complete</button>
                            </form>
                            <form th:action="@{/admin/appointments/{id}/cancel(id=${a.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Cancel this appointment and reopen the slot?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}"><td colspan="7" class="text-center text-muted py-4">No appointments found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
