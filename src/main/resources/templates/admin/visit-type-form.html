<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Visit Type')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-4">
                <h1 class="h4 mb-3" th:text="${visitType.id == null} ? 'Add visit type' : 'Edit visit type'">Visit type</h1>
                <form th:action="@{/admin/visit-types/save}" th:object="${visitType}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" th:field="*{name}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="2" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="durationMinutes" class="form-label">Duration (minutes)</label>
                        <input id="durationMinutes" type="number" min="10" max="240" th:field="*{durationMinutes}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" th:field="*{active}" class="form-check-input" id="active">
                        <label class="form-check-label" for="active">Active (patients can book it)</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/admin/visit-types}" class="btn btn-link">Back</a>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
