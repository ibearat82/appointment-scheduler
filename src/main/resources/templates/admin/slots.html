<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Time Slots')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Time slots</h1>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card p-4 mb-4">
        <h2 class="h5">Open slots for a day</h2>
        <form th:action="@{/admin/slots/generate}" th:object="${form}" method="post" novalidate class="row g-3 align-items-end">
            <div th:if="${#fields.hasGlobalErrors()}" class="col-12 text-danger small">
                <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</span>
            </div>
            <div class="col-12 col-md-3">
                <label for="date" class="form-label">Date</label>
                <input id="date" type="date" th:field="*{date}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{date}"></div>
            </div>
            <div class="col-6 col-md-2">
                <label for="fromTime" class="form-label">From</label>
                <input id="fromTime" type="time" th:field="*{fromTime}" class="form-control" th:errorclass="is-invalid">
            </div>
            <div class="col-6 col-md-2">
                <label for="toTime" class="form-label">To</label>
                <input id="toTime" type="time" th:field="*{toTime}" class="form-control"
                       th:classappend="${#fields.hasErrors('timeRangeValid')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{timeRangeValid}"></div>
            </div>
            <div class="col-6 col-md-2">
                <label for="intervalMinutes" class="form-label">Slot length (min)</label>
                <input id="intervalMinutes" type="number" min="10" max="240" th:field="*{intervalMinutes}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{intervalMinutes}"></div>
            </div>
            <div class="col-6 col-md-3">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Open slots</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-header bg-white fw-semibold">Upcoming slots</div>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Date</th><th>Start</th><th>End</th><th>Status</th><th class="text-end">Action</th></tr></thead>
                <tbody>
                <tr th:each="s : ${slots}">
                    <td th:text="${#temporals.format(s.slotDate, 'EEE, MMM d, yyyy')}">date</td>
                    <td th:text="${#temporals.format(s.startTime, 'h:mm a')}">start</td>
                    <td th:text="${#temporals.format(s.endTime, 'h:mm a')}">end</td>
                    <td><span class="badge" th:classappend="${s.available} ? 'text-bg-success' : 'text-bg-warning'"
                              th:text="${s.available} ? 'Open' : 'Booked'">Open</span></td>
                    <td class="text-end">
                        <form th:if="${s.available}" th:action="@{/admin/slots/{id}/delete(id=${s.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(slots)}"><td colspan="5" class="text-center text-muted py-4">No upcoming slots.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
