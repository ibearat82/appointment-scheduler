<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="card p-4">
                <h1 class="h4 mb-3">My profile</h1>
                <p class="text-muted">Email: <strong th:text="${user.email}">email</strong>
                    &middot; Role: <span th:text="${user.role}">PATIENT</span></p>
                <form th:action="@{/profile}" th:object="${form}" method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input id="firstName" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input id="lastName" th:field="*{lastName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input id="phone" type="tel" th:field="*{phone}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="dateOfBirth" class="form-label">Date of birth</label>
                            <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Save profile</button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
