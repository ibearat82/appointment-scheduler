<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book Appointment')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Book an appointment</h1>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="card p-4">
        <div th:replace="~{fragments/slot-picker :: dayChooser('/patient/book')}"></div>

        <form th:action="@{/patient/book(date=${selectedDate})}" th:object="${form}" method="post" novalidate
              th:if="${selectedDate}">
            <div class="mb-3">
                <label for="visitTypeId" class="form-label fw-semibold">2. Visit type</label>
                <select id="visitTypeId" th:field="*{visitTypeId}" class="form-select" th:errorclass="is-invalid">
                    <option value="">Choose a visit type...</option>
                    <option th:each="vt : ${visitTypes}" th:value="${vt.id}"
                            th:text="${vt.name} + ' (' + ${vt.durationMinutes} + ' min)'">Checkup</option>
                </select>
                <div class="invalid-feedback" th:errors="*{visitTypeId}"></div>
            </div>

            <div th:replace="~{fragments/slot-picker :: slotChoices}"></div>

            <div class="mb-3">
                <label for="notes" class="form-label fw-semibold">Notes for the doctor (optional)</label>
                <textarea id="notes" th:field="*{notes}" class="form-control" rows="2" maxlength="255"
                          th:errorclass="is-invalid" placeholder="Reason for visit"></textarea>
                <div class="invalid-feedback" th:errors="*{notes}"></div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Book appointment</button>
            <a th:href="@{/patient/dashboard}" class="btn btn-link">Cancel</a>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
