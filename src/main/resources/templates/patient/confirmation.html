<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Appointment Details')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="card p-4">
                <h1 class="h4 mb-3"><i class="bi bi-calendar-check text-success"></i> Appointment details</h1>
                <dl class="row mb-0">
                    <dt class="col-sm-4">Patient</dt>
                    <dd class="col-sm-8" th:text="${appointment.patient.fullName}">Name</dd>
                    <dt class="col-sm-4">Visit type</dt>
                    <dd class="col-sm-8" th:text="${appointment.visitType.name}">Checkup</dd>
                    <dt class="col-sm-4">Date</dt>
                    <dd class="col-sm-8" th:text="${#temporals.format(appointment.timeSlot.slotDate, 'EEEE, MMMM d, yyyy')}">date</dd>
                    <dt class="col-sm-4">Time</dt>
                    <dd class="col-sm-8" th:text="${#temporals.format(appointment.timeSlot.startTime, 'h:mm a')} + ' - ' + ${#temporals.format(appointment.timeSlot.endTime, 'h:mm a')}">time</dd>
                    <dt class="col-sm-4">Status</dt>
                    <dd class="col-sm-8" th:text="${appointment.status}">BOOKED</dd>
                    <dt class="col-sm-4" th:if="${appointment.notes}">Notes</dt>
                    <dd class="col-sm-8" th:if="${appointment.notes}" th:text="${appointment.notes}">notes</dd>
                    <dt class="col-sm-4">Confirmation #</dt>
                    <dd class="col-sm-8" th:text="'A-' + ${appointment.id}">A-1</dd>
                </dl>
                <div class="mt-4 d-flex flex-wrap gap-2">
                    <a th:href="@{/patient/appointments}" class="btn btn-primary">My appointments</a>
                    <a th:href="@{/patient/appointments/{id}/edit(id=${appointment.id})}" class="btn btn-outline-primary"
                       th:if="${appointment.status.name() == 'BOOKED'}">Reschedule</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
