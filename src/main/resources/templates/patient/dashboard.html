<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h1 class="h3 mb-0">Welcome, <span th:text="${user.firstName}">Patient</span></h1>
        <a th:href="@{/patient/book}" class="btn btn-primary"><i class="bi bi-calendar-plus"></i> Book an appointment</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-header bg-white fw-semibold">Upcoming appointments</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2"
                        th:each="a : ${upcoming}">
                        <div>
                            <div class="fw-semibold" th:text="${a.visitType.name}">Annual Checkup</div>
                            <div class="text-muted small"
                                 th:text="${#temporals.format(a.timeSlot.slotDate, 'EEEE, MMM d, yyyy')} + ' at ' + ${#temporals.format(a.timeSlot.startTime, 'h:mm a')}">date</div>
                        </div>
                        <a th:href="@{/patient/appointments/{id}(id=${a.id})}" class="btn btn-outline-primary btn-sm">View</a>
                    </li>
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(upcoming)}">
                        You have no upcoming appointments.
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6">Quick links</h2>
                    <div class="d-grid gap-2">
                        <a th:href="@{/patient/appointments}" class="btn btn-outline-secondary">My appointments</a>
                        <a th:href="@{/profile}" class="btn btn-outline-secondary">My profile</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
