<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Day chooser (GET) - reloads the page with ?date=... */-->
<div th:fragment="dayChooser(actionUrl)" class="mb-3">
    <label class="form-label fw-semibold">1. Choose a day</label>
    <div th:if="${#lists.isEmpty(days)}" class="alert alert-warning mb-0">
        There are no open appointment times in the next 30 days. Please check back later or call the office.
    </div>
    <div class="d-flex flex-wrap gap-2" th:unless="${#lists.isEmpty(days)}">
        <a th:each="d : ${days}" th:href="@{${actionUrl}(date=${d})}"
           th:classappend="${d == selectedDate} ? 'btn-primary' : 'btn-outline-primary'"
           class="btn btn-sm" th:text="${#temporals.format(d, 'EEE MMM d')}">Mon Nov 16</a>
    </div>
</div>

<!--/* Slot radio buttons - only open slots are shown, so a taken time cannot be picked */-->
<div th:fragment="slotChoices" class="mb-3">
    <label class="form-label fw-semibold">3. Choose a time
        <span th:if="${selectedDate}" class="text-muted fw-normal"
              th:text="'on ' + ${#temporals.format(selectedDate, 'EEEE, MMM d')}"></span></label>
    <div class="d-flex flex-wrap gap-2">
        <div class="slot-option" th:each="s : ${slots}">
            <input type="radio" name="slotId" th:id="'slot' + ${s.id}" th:value="${s.id}"
                   th:checked="${form.slotId == s.id}">
            <label class="btn btn-outline-primary" th:for="'slot' + ${s.id}"
                   th:text="${#temporals.format(s.startTime, 'h:mm a')}">9:00 AM</label>
        </div>
    </div>
    <p th:if="${selectedDate != null and #lists.isEmpty(slots)}" class="text-muted mt-2 mb-0">No open times on this day.</p>
    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('slotId')}" th:errors="*{slotId}"></div>
</div>
</body>
</html>
